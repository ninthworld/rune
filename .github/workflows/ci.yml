name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, declared rather than inherited: an undeclared token takes the repository
# default, which can be widened in Settings without touching this file. These jobs build and
# test a checkout and talk to nobody, so read is all they get, and no job below raises it.
permissions:
  contents: read

# Every `uses:` below is pinned to a full-length commit SHA: a tag is mutable, and whoever
# can move `v4` can change what runs in CI — which is where the credentials are. The trailing
# comment is the release that SHA belongs to, so the pin stays reviewable and Dependabot can
# bump it. Each pin is the newest release *within the major this workflow already used*, so
# this is a hardening change and not a silent upgrade.
jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Pinned by SHA, `dtolnay/rust-toolchain` can no longer read the toolchain off the ref
      # — `@stable` *was* the input — so it must be named explicitly. Without this the
      # install fails rather than quietly defaulting to stable.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Run through the Make targets so CI and `make check` use identical commands;
      # the Makefile is the single source of truth for fmt/clippy/test options.
      - name: Lint (fmt + clippy)
        run: make engine-lint
      - name: Test
        run: make engine-test

  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      # `make client-audit client-check` runs `npm ci` once (shared prerequisite),
      # then audit, lint, typecheck, test, and build — identical to the local gate.
      - name: Check (audit + lint + typecheck + test + build)
        run: make client-audit client-check

  # The browser suite (ADR 0011): the smoke canary (#279) and the four-player
  # vertical slice (#499). Its own job, deliberately separate from `Client`: it
  # needs a real Chromium, a Vite dev server, and the compiled `rune-server`,
  # none of which belong in the fast unit gate. A few minutes of wall clock on
  # top of the build steps — the slice drives four live browser contexts twice.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            clients/web/e2e/package-lock.json
      - name: Install e2e toolchain
        run: make e2e-install
      # Only Chromium, and only the browser the pinned @playwright/test expects.
      # `make e2e` never downloads a browser, so this is the one place it happens.
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
        working-directory: clients/web/e2e
      # The `github` reporter annotates the failing assertion inline on the PR,
      # and the spec's failure messages carry the diagnostic detail (what was
      # staged, what the server logged). No artifact upload action is wired here
      # — every `uses:` in this repo is pinned by verified SHA, and adding one is
      # a separate, reviewable change.
      - name: Browser suite (smoke canary + four-player slice)
        run: make e2e
